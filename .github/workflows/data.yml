name: Transit data

# Rebuilds the bundle the app reads from TransMilenio's open static GTFS and
# publishes it on GitHub Pages. No API key anywhere.
on:
  schedule:
    - cron: "17 11 * * *" # 06:17 in Bogotá, after TransMilenio drops the day's GTFS
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/gtfs/**", ".github/workflows/data.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build bundle
        run: python3 -I scripts/gtfs/build.py site
      - name: Index page
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>Paradero Abierto data</title>
          <p>Compact transit bundle built daily from TransMilenio's open GTFS (CC BY-SA 4.0).
          <a href="meta-v1.json">meta-v1.json</a> · <a href="transit-v1.json">transit-v1.json</a></p>
          EOF
          ls -la site
          cat site/meta-v1.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
