appId: io.github.bask209.paraderoabierto
name: Open data smoke test
---
- launchApp:
    clearState: true
    permissions:
      location: allow
# Chapinero, through a mock location the fused provider accepts.
- setLocation:
    latitude: 4.6486
    longitude: -74.0628
# A slow emulator sometimes shows "isn't responding" for the launcher; let it be.
- tapOn:
    text: "Wait"
    optional: true
# Onboarding: the welcome, a note, then location.
- extendedWaitUntil:
    visible: "Get started"
    timeout: 90000
- takeScreenshot: 01-onboarding
- tapOn: "Get started"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 20000
- tapOn: "Continue"
- waitForAnimationToEnd:
    timeout: 10000
- scrollUntilVisible:
    element: "Allow location"
    direction: DOWN
    timeout: 60000
- tapOn: "Allow location"
- tapOn:
    text: "While using the app|Only this time|Allow"
    optional: true
- setLocation:
    latitude: 4.6486
    longitude: -74.0628

# Home: nearby stops come from the bundle on the phone (first launch downloads it).
- extendedWaitUntil:
    visible: ".*within 700 m.*"
    timeout: 180000
- takeScreenshot: 02-home-nearby

# Search a route by its code and open it.
- tapOn: "Search"
- extendedWaitUntil:
    visible: "B10"
    timeout: 20000
- tapOn: "B10"
- extendedWaitUntil:
    visible: "Routes"
    timeout: 60000
- takeScreenshot: 03-search-b10
- tapOn:
    text: ".*Portal Norte.*"
    index: 0
- extendedWaitUntil:
    visible: ".*(buses running|bus running|No buses running|First bus).*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 04-route-b10

# A station: live and scheduled arrivals. The search tab takes ?q= as a deep link.
- openLink: "paraderoabierto://search?q=Calle%2072"
- extendedWaitUntil:
    visible: "Stations and stops"
    timeout: 60000
- takeScreenshot: 05-search-calle72
- tapOn: "Calle 72 - Areandina"
- extendedWaitUntil:
    visible: ".*(Station|Estación).*"
    timeout: 60000
- extendedWaitUntil:
    visible: ".*min.*"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 06-station
- swipe:
    direction: UP
    duration: 800
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 07-station-arrivals
- swipe:
    direction: UP
    duration: 800
- takeScreenshot: 08-station-more
