appId: io.github.bask209.paraderoabierto
name: Open data smoke test
---
- launchApp:
    clearState: true
    permissions:
      location: allow
# A slow emulator sometimes shows "isn't responding" for the launcher; let it be.
- tapOn:
    text: "Wait"
    optional: true
# Onboarding: the welcome, a note, then location.
- extendedWaitUntil:
    visible: "Get started"
    timeout: 90000
- takeScreenshot: 01-onboarding
- tapOn: "Get started"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 20000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Allow location"
    timeout: 20000
- tapOn: "Allow location"
- tapOn:
    text: "While using the app|Only this time|Allow"
    optional: true

# Home: nearby stops come from the bundle on the phone (first launch downloads it).
- extendedWaitUntil:
    visible: ".*within 700 m.*"
    timeout: 180000
- takeScreenshot: 02-home-nearby

# Search a route by its code and open it.
- tapOn: "Search"
- extendedWaitUntil:
    visible: "B10"
    timeout: 20000
- tapOn: "B10"
- extendedWaitUntil:
    visible: "Routes"
    timeout: 60000
- takeScreenshot: 03-search-b10
- tapOn:
    text: ".*Portal Norte.*"
    index: 0
- extendedWaitUntil:
    visible: ".*(buses running|bus running|No buses running|First bus).*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 04-route-b10

# A station: live and scheduled arrivals. The search tab takes ?q= as a deep link.
- openLink: "paraderoabierto://search?q=Calle%2072"
- extendedWaitUntil:
    visible: "Stations and stops"
    timeout: 60000
- takeScreenshot: 05-search-calle72
- tapOn:
    text: ".*Calle 72.*"
    index: 1
- extendedWaitUntil:
    visible: ".*min.*"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 06-stop-arrivals
